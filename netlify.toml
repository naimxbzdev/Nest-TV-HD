# Netlify configuration for Nest TV HD (React + Vite SPA)
# Branded by Naim Xbz

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Single Page Application (SPA) redirect rule
# Fixes 404 Page Not Found error on page reload or deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term cache headers for production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
